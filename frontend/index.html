<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

  <header class="page-header"><p class="eyebrow">JERSEY PRINTING SERVICE</p><h1>Invoice Generator</h1><p class="page-intro">Create an invoice for your jersey order.</p></header>

  <!-- ========================= -->
  <!-- GENERAL -->
  <!-- ========================= -->
  <div class="section">
    <h2>General Details</h2>

    <div class="grid-2">
      <div class="field">
        <label for="orderDate">Date</label>
        <input type="date" id="orderDate">
      </div>

      <div class="field">
        <label for="invoiceNumber">Invoice Number</label>
        <input type="text" id="invoiceNumber" placeholder="Generated automatically" readonly>
      </div>

    </div>
  </div>

  <!-- ========================= -->
  <!-- CUSTOMER -->
  <!-- ========================= -->
  <div class="section">
    <h2>Customer Details</h2>

    <div class="grid-2">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name">
      </div>

      <div class="field">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="text" id="phone">
      </div>

    </div>

    <div class="field full">
      <label for="address">Address</label>
      <textarea id="address"></textarea>
    </div>
  </div>

  <div class="section">
  <h2>Jobs</h2>

  <div id="jobContainer"></div>

    <button type="button" id="addJob">+ Add Job</button>
  </div>

  <!-- ========================= -->
  <!-- SPECIAL REQUEST -->
  <!-- ========================= -->
  <div class="section">
    <h2>Special Request</h2>

    <div id="specialContainer"></div>

    <button type="button" id="addSpecial">+ Add Request</button>
  </div>

  <!-- ========================= -->
  <!-- POSTAGE -->
  <!-- ========================= -->
  <div class="section">
    <h2>Postage</h2>

    <div class="field">
      <label for="postage">Postage Price (RM)</label>
      <input type="number" min="0" step="0.01" id="postage">
    </div>
  </div>

  <!-- ========================= -->
  <!-- SUBMIT -->
  <!-- ========================= -->
  <button type="button" class="submit-btn">Generate Invoice</button>
  <p id="invoiceStatus" role="status" aria-live="polite"></p>

</div>

<div style="display:none">
    <!-- TEMP HIDDEN TEMPLATES -->
    <select id="material">
    <option value="Eyelet 150GSM">Eyelet 150GSM</option>
    </select>

    <select id="collar">
    <option value="Roundneck">Roundneck</option>
    </select>

    <select id="sleeve">
    <option value="Short Sleeve">Short Sleeve</option>
    </select>

    <select id="nameset">
    <option value="None">None</option>
    </select>

    <select id="cutting">
    <option value="Standard">Standard</option>
    </select>

    <select id="piping">
    <option value="Type A">Type A</option>
    </select>

</div>
    <script type="module" src="js/ui.js"></script>
</body>
</html>
